platform=u96v2_sbc_base
debug=1
save-temps=1

[connectivity]
nk=lzw_kernel:1:lzw_kernel_1
# Both pointer arguments share one AXI bundle (gmem), so they use one port.
sp=lzw_kernel_1.input:HP0
sp=lzw_kernel_1.output:HP0

# Faster kernel clock: uncomment once the design meets timing at the default clock
# (index 1 = 300 MHz, index 4 = 200 MHz, see the platform's clock list).
# [clock]
# id=1:lzw_kernel_1
